<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa - Vista Lugar</title>
<style>
    body {
        font-family: Roboto, Arial, sans-serif;
        background: #eeeeee;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
        margin: 0;
    }
    .phone {
        width: 360px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        overflow: hidden;
        border: 8px solid #111;
    }
    .statusbar {
        background: #3700B3;
        height: 20px;
    }
    .appbar {
        background: #6200EE;
        color: white;
        padding: 14px 16px;
        font-size: 18px;
        font-weight: 500;
    }
    .content {
        padding: 16px;
    }
    .nombre {
        text-align: center;
        font-size: 20px;
        font-weight: 500;
        color: #212121;
        margin-bottom: 12px;
    }
    .tipo-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
    }
    .tipo-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #6200EE;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
        flex-shrink: 0;
    }
    .tipo-text {
        font-size: 16px;
        color: #424242;
    }
    .campo {
        font-size: 16px;
        color: #212121;
        margin-top: 10px;
    }
    .gps {
        font-size: 13px;
        color: #666666;
        margin-top: 8px;
    }
    .rating {
        text-align: center;
        margin-top: 16px;
        font-size: 24px;
        color: #F4B400;
        letter-spacing: 2px;
    }
    .foto-wrap {
        position: relative;
        margin-top: 16px;
        border-radius: 8px;
        overflow: hidden;
    }
    .foto {
        width: 100%;
        height: 160px;
        background: linear-gradient(180deg, #DDDDDD 60%, #AAAAAA 60%);
        position: relative;
    }
    .foto::after {
        content: "";
        position: absolute;
        left: 20px; bottom: 20px;
        width: 60px; height: 40px;
        background: #999;
        clip-path: polygon(0% 100%, 30% 40%, 55% 70%, 75% 20%, 100% 100%);
    }
    .sol {
        position: absolute;
        right: 40px; top: 20px;
        width: 24px; height: 24px;
        border-radius: 50%;
        background: #F4D35E;
    }
    .foto-botones {
        position: absolute;
        top: 8px; right: 8px;
        display: flex;
        gap: 8px;
    }
    .foto-botones span {
        width: 32px; height: 32px;
        background: rgba(0,0,0,0.5);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 15px;
    }
    .compartir {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #6200EE;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .nota {
        max-width: 360px;
        margin: 16px auto 0;
        font-size: 12px;
        color: #777;
        text-align: center;
    }
</style>
</head>
<body>
<div>
    <div class="phone">
        <div class="statusbar"></div>
        <div class="appbar">Mis Lugares</div>
        <div class="content">
            <div class="nombre">Escuela Politecnica Superior de Gandia</div>

            <div class="tipo-row">
                <div class="tipo-icon">&#128205;</div>
                <div class="tipo-text">Lugar guardado</div>
            </div>

            <div class="campo">C/ Paranimf, 1 46730 Gandia (SPAIN)</div>
            <div class="campo">962849300</div>
            <div class="gps">GPS: GeoPunto {longitud=-100.309, latitud=25.686}</div>

            <div class="rating">&#9733;&#9733;&#9733;&#9733;&#9734;</div>

            <div class="foto-wrap">
                <div class="foto"><div class="sol"></div></div>
                <div class="foto-botones">
                    <span>&#128247;</span>
                    <span>&#128444;</span>
                </div>
            </div>

            <button class="compartir">Compartir</button>
        </div>
    </div>
    <div class="nota">Vista previa generada a partir de app/src/main/res/layout/vista_lugar.xml + datos reales de Lugar.java / GeoPunto.java</div>
</div>
</body>
</html>
